# `type` names a kind of event registered by a providing plugin. That kind's own
# keys are read from this same section.
type: demo

# The name key, looked up in the language files of whichever plugin owns the event.
display: event-demo

duration: 10m
cooldown: 0s

# Weight for weighted-random. A weight of zero leaves the event available only by
# an admin request or a player poll.
weight: 1
