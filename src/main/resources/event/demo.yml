# `type` указывает на вид события, зарегистрированный плагином-поставщиком.
# Ключи самого вида читаются из этой же секции.
type: demo

# Ключ имени в языковом файле плагина, которому принадлежит событие.
display: event-demo

duration: 10m
cooldown: 0s

# Вес для weighted-random. Нулевой вес оставляет событие доступным
# только по запросу администратора или по голосованию.
weight: 1
