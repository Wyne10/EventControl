# `type` names a kind of event registered by a providing plugin. That kind's own
# keys are read from this same section.
type: demo

# The name key, looked up in EventControl's own language files.
display: event-demo

# Where this event happens. The queue does not decide: an event picks its own
# place, so the key belongs to whichever type reads it — here, `demo`.
# Defaults to the server's first world.
world: world

duration: 10m
cooldown: 0s

# Weight for weighted-random. A weight of zero leaves the event available only by
# an admin request or a player poll.
weight: 1
