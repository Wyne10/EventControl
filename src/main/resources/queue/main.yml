# Одна очередь — это расписание. Движок держит `lookahead` слотов
# запланированными и готовит первый за `prepare-lead` до старта, поэтому
# координаты и всё остальное известны заранее.
world: world

# Промежуток между событиями.
interval: 30m

# За сколько до старта событие должно быть полностью подготовлено.
prepare-lead: 5m

# Сколько слотов держать запланированными: %eventcontrol_main_next2_name%
# работает только в пределах этого окна.
lookahead: 3

# sequential | weighted-random | poll
source: weighted-random
weighted-random-avoid-repeats: 1

# Настройки источника `poll`: сколько длится голосование и сколько
# вариантов в бюллетене. Голосование открывается до того, как слот
# будет заполнен, поэтому варианты можно показать игрокам заранее.
poll-window: 2m
poll-candidates: 3

events:
  - demo
  - demo-wide

# Объявления задаются относительно известного времени старта, поэтому
# предупреждение и сообщение о старте — один и тот же механизм.
#
# `at` задаёт и точку отсчёта, и сдвиг: `-5m` — за пять минут до старта,
# `0` — в момент старта, `end` — в конце, `end-10s` — за десять секунд до конца.
# Ключа `on` нет специально: YAML читает `on` как булево значение.
announce:
  - at: -5m
    key: info-event-starting-soon
    audience: world
  - at: 0
    key: info-event-started
    audience: world
  - at: end
    key: info-event-ended
    audience: world
