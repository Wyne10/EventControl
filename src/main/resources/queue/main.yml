# A queue is a timeline. The engine keeps `lookahead` slots planned and resolves
# the head one `prepare-lead` before it starts, so a location and everything else
# about an event are known in advance.

# Gap between consecutive events.
interval: 30m

# How long before its start time the head slot must be fully prepared.
prepare-lead: 5m

# How many slots stay planned. %eventcontrol_main_next2_name% only resolves
# inside this window.
lookahead: 3

# Which source decides what fills a slot. `sequential` and `weighted-random`
# ship here; others are registered by other plugins — `poll` comes from
# EventPoll, and reads its own `poll-window` and `poll-candidates` from this
# same section.
source: weighted-random
weighted-random-avoid-repeats: 1

# Whether this queue starts ticking as soon as it loads. A queue with
# `auto-start: false` waits for `/eventcontrol start <queue>`.
auto-start: true

events:
  - demo
  - demo-wide

