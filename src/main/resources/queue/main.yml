# A queue is a timeline. The engine keeps `lookahead` slots planned and resolves
# the head one `prepare-lead` before it starts, so a location and everything else
# about an event are known in advance.
world: world

# Gap between consecutive events.
interval: 30m

# How long before its start time the head slot must be fully prepared.
prepare-lead: 5m

# How many slots stay planned. %eventcontrol_main_next2_name% only resolves
# inside this window.
lookahead: 3

# sequential | weighted-random | poll
source: weighted-random
weighted-random-avoid-repeats: 1

# Settings for the `poll` source: how long voting stays open and how many
# options are on the ballot. The poll opens before the slot is filled, so the
# options can be shown to players with real detail.
poll-window: 2m
poll-candidates: 3

events:
  - demo
  - demo-wide

# Announcements are scheduled against a start time the engine already knows, so
# an early warning and the start message are the same mechanism.
#
# `at` carries both the anchor and the offset: `-5m` is five minutes before the
# start, `0` is as it starts, `end` is as it ends, `end-10s` ten seconds before
# the end. There is deliberately no `on` key — YAML reads a bare `on` as a
# boolean, so `on: end` would never parse.
announce:
  - at: -5m
    key: info-event-starting-soon
    audience: world
  - at: 0
    key: info-event-started
    audience: world
  - at: end
    key: info-event-ended
    audience: world
