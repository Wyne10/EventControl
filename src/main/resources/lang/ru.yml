### Format

format-queue-entry: "<gray>▶ <white><queue> <gray>— <white><state><gray>, впереди: <white><upcoming>"
format-queue-header: "<gold>▶ <white>Очередь <gold><queue> <gray>(<state>)"
format-slot-entry: " <gray><index>. <white><event> <gray><state>/<origin> <gray>через <white><starts-in> <gray><position>"
format-poll-candidate: " <gray>• <white><event-name> <gray>(<white><votes><gray>) <yellow><click:run_command:'/event poll vote <queue> <event>'>[Голосовать]</click>"

