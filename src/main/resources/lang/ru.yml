### Format

format-queue-entry: "<gray>▶ <white><queue> <gray>— <white><state><gray>, впереди: <white><upcoming>"
format-queue-header: "<gold>▶ <white>Очередь <gold><queue> <gray>(<state>)"
format-slot-entry: " <gray><index>. <white><event> <gray><state>/<origin> <gray>через <white>%dtf_duration_<starts-in>ms_mm' мин. 'ss' сек.'% <gray><position>"

### Messages

## Info

info-no-queues: "<gray>▶ <white>Сейчас нет активных очередей событий"
info-event-active: "<gold>▶ <white>Сейчас идёт <gold>%eventcontrol_<event>% <white>— до конца <gold>%dtf_duration_<ends-in>ms_mm' мин. 'ss' сек.'%<white>, координаты <gold><position>"
info-event-upcoming: "<gray>▶ <white>Далее <gold>%eventcontrol_<event>% <white>— через <gold>%dtf_duration_<starts-in>ms_mm' мин. 'ss' сек.'%<white>, координаты <gold><position>"

## Error

error-unknown-queue: "<red>▶ <white>Очередь <red><queue> <white>не найдена"
error-unknown-event: "<red>▶ <white>Событие <red><event> <white>не найдено"
error-queue-empty: "<red>▶ <white>В очереди <red><queue> <white>нечего пропускать"

## Success

success-plugin-reload: "<green>▶ <white>Плагин перезагружен!"
success-queue-started: "<green>▶ <white>Очередь <green><queue> <white>запущена"
success-queue-stopped: "<green>▶ <white>Очередь <green><queue> <white>остановлена"
success-queue-skipped: "<green>▶ <white>Событие <green><event> <white>пропущено в очереди <green><queue>"
success-event-requested: "<green>▶ <white>Событие <green><event> <white>добавлено в очередь <green><queue><white>, старт через <green>%dtf_duration_<starts-in>ms_mm' мин. 'ss' сек.'%"

### Events

# Ключ `display:` из файла события ищется здесь. Событие, зарегистрированное
# другим плагином, тоже называется здесь: файл определения принадлежит этому
# плагину, значит и ключ в нём тоже.
event-demo: "<aqua>Демонстрационное событие"
event-demo-wide: "<aqua>Демонстрационное событие (широкий поиск)"
