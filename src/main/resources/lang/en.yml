### Format

format-queue-entry: "<gray>▶ <white><queue> <gray>— <white><state><gray>, upcoming: <white><upcoming>"
format-queue-header: "<gold>▶ <white>Queue <gold><queue> <gray>(<state>)"
format-slot-entry: " <gray><index>. <white><event> <gray><state>/<origin> <gray>in <white>%dtf_duration_<starts-in>ms_mm'm 'ss's'% <gray><position>"
format-poll-candidate: " <gray>• <white><event-name> <gray>(<white><votes><gray>) <yellow><click:run_command:'/event poll vote <queue> <event>'>[Vote]</click>"

