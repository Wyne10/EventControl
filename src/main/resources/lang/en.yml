### Format

format-queue-entry: "<gray>▶ <white><queue> <gray>— <white><state><gray>, upcoming: <white><upcoming>"
format-queue-header: "<gold>▶ <white>Queue <gold><queue> <gray>(<state>)"
format-slot-entry: " <gray><index>. <white><event> <gray><state>/<origin> <gray>in <white>%dtf_duration_<starts-in>ms_mm'm 'ss's'% <gray><position>"

### Messages

## Info

info-no-queues: "<gray>▶ <white>No event queues are running right now"
info-event-active: "<gold>▶ <white>Running now: <gold>%eventcontrol_<event>% <white>— ends in <gold>%dtf_duration_<ends-in>ms_mm'm 'ss's'%<white>, at <gold><position>"
info-event-upcoming: "<gray>▶ <white>Next: <gold>%eventcontrol_<event>% <white>— in <gold>%dtf_duration_<starts-in>ms_mm'm 'ss's'%<white>, at <gold><position>"

## Error

error-unknown-queue: "<red>▶ <white>No such queue: <red><queue>"
error-unknown-event: "<red>▶ <white>No such event: <red><event>"
error-queue-empty: "<red>▶ <white>Nothing to skip in queue <red><queue>"

## Success

success-plugin-reload: "<green>▶ <white>Plugin reloaded!"
success-queue-started: "<green>▶ <white>Queue <green><queue> <white>started"
success-queue-stopped: "<green>▶ <white>Queue <green><queue> <white>stopped"
success-queue-skipped: "<green>▶ <white>Skipped <green><event> <white>in queue <green><queue>"
success-event-requested: "<green>▶ <white>Queued <green><event> <white>in <green><queue><white>, starting in <green>%dtf_duration_<starts-in>ms_mm'm 'ss's'%"

### Events

# A `display:` key from an event definition resolves here. An event type shipped
# by another plugin puts its name here too — the definition file is this
# plugin's, so the key it names is this plugin's.
event-demo: "<aqua>Demo event"
event-demo-wide: "<aqua>Demo event (wide search)"
